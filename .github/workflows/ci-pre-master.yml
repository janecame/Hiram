name: CI Build Check

# Phase 1: runs on pushes to the pre-deployment branch so we can confirm the
# pipeline builds and lints cleanly. A pull_request gate on master is added later.
on:
  push:
    branches: [pre-master-branch]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Lint all workspaces
        run: npm run lint
